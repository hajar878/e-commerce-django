{% extends 'app/base.html' %}
{% load static %}
{% block title %}Password Changed Successfully{% endblock title %}

{% block main-content %}
<div class="container my-5">
    <div class="row">
        <!-- Sidebar Navigation -->
        <div class="col-sm-3 border-end">
            <div class="sidebar-content">
                <h3 class="welcome-msg mb-3">Welcome <span class="text-capitalize">{{request.user}}</span></h3>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="col-sm-8 ps-5">
            <div class="shadow p-5 rounded bg-white text-center">
                <!-- Success Message -->
                <div class="alert alert-success" role="alert">
                    <h3 class="mb-0">Password Changed Successfully!</h3>
                </div>
                
                <!-- Success Animation -->
                <div class="mt-4">
                    <iframe src="https://giphy.com/embed/ibolLe3mOqHE3PQTtk" 
                            width="200" 
                            height="200" 
                            frameBorder="0" 
                            class="giphy-embed" 
                            allowFullScreen
                            title="Success Animation">
                    </iframe>
                    
                    <p class="mt-3 text-muted">Your password has been updated successfully.</p>
                    
                    <a href="{% url 'profile' %}" class="btn btn-primary mt-3 px-4 py-2">
                        Return to Profile
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Styles cohérents avec vos autres pages */
    body {
        background: linear-gradient(135deg, #f5f2ed, #ffffff);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-attachment: fixed;
        min-height: 100vh;
    }
    
    .container {
        margin-top: 50px;
    }
    
    .welcome-msg {
        color: #7a6b5a;
        font-weight: 400;
        letter-spacing: 1px;
        margin-left: 5px;
    }
    .text-capitalize {
        color: #8a9d7b;
        font-weight: 500;
    }
    
    .border-end {
        border-right: 1px solid rgba(122, 107, 90, 0.2) !important;
    }
    
    .sidebar-content {
        padding: 15px 15px 15px 20px;
    }
    
    .btn-menu {
        background-color: #7a6b5a;
        color: white;
        border: 1px solid #7a6b5a;
        border-radius: 5px;
        text-align: left;
        padding: 8px 15px;
        font-weight: 500;
    }
    
    .shadow {
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.1) !important;
    }
    
    .alert-success {
        background-color: rgba(138, 157, 123, 0.2);
        border-color: rgba(138, 157, 123, 0.3);
        color: #5e6b52;
        border-radius: 10px;
    }
    
    .btn-primary {
        background-color: #7a6b5a;
        border: none;
        border-radius: 30px;
        padding: 10px 20px;
        transition: all 0.3s ease;
    }
    
    .btn-primary:hover {
        background-color: #5e5044;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(122, 107, 90, 0.2);
    }
    
    .text-muted {
        color: #7a6b5a !important;
    }
</style>
{% endblock main-content %}
